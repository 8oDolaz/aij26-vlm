# a1: SmolVLA on full LIBERO v3.0 with the whole backbone trainable (vision encoder + connector + text layers + expert).
# Based on vendor/participant/configs/vla_libero.yaml; only policy freezing, LR and runtime differ.
# Used by configs/a1_full_unfreeze.yaml (see the run command there).
#
# Freezing in lerobot 0.5.1 (smolvlm_with_expert.py set_requires_grad):
#   train_expert_only: true  -> the WHOLE VLM is frozen, vision tower included; freeze_vision_encoder is then ignored.
#   train_expert_only: false -> text layers + connector train (except the last text layer, lm_head, final norm: they get no gradient).
#   freeze_vision_encoder    -> only has an effect when train_expert_only is false.
# So "vision unfrozen, text frozen" is not reachable from this file.
# The safer variant (vision frozen, text + connector trainable) is the same file with freeze_vision_encoder: true.
#
# Only the VLM copy inside action_expert/ is trained here; submission/smolvlm2 (the 8 VLM benches) is untouched.
# paths.vlm_checkpoint / paths.dataset_dir / paths.output_dir / runtime are injected by run_pipeline.py.

dataset:
  repo_id: HuggingFaceVLA/libero
  revision: v3.0
  episode_count: 1693                # all of v3.0; organizers allow it, nothing else
  subset_seed: 1000
  use_imagenet_stats: true
  video_backend: pyav

policy:
  load_vlm_weights: true             # init the VLM from paths.vlm_checkpoint (our SFT model)
  train_expert_only: false           # unfreeze the VLM (required for the vision encoder to train at all)
  freeze_vision_encoder: true      # unfreeze SigLIP too
  train_state_proj: true
  chunk_size: 50
  n_action_steps: 50
  num_vlm_layers: -1                 # all 32 layers, same architecture as the kit default (16 would ~halve VLM compute)
  num_expert_layers: -1
  expert_width_multiplier: 0.75
  attention_mode: cross_attn
  self_attn_every_n_layers: 2
  device: cuda

optimizer:
  # One LR for every parameter group (the kit passes no per-group LR).
  # 1e-4 is the kit value for a frozen VLM + from-scratch expert; halved here because the pretrained VLM now moves too.
  learning_rate: 0.00005
  betas: [0.9, 0.95]
  epsilon: 0.00000001
  weight_decay: 0.0000000001
  grad_clip_norm: 10.0
  warmup_steps: 1000
  decay_steps: 30000
  decay_learning_rate: 0.0000025

training:
  job_name: smolvla-libero-a1-full-unfreeze
  steps: 50000                       # x batch 4 x 2 GPUs = 240k samples, ~0.9 epoch of LIBERO
  batch_size: 4                      # per GPU
  num_workers: 16
  seed: 1000
  log_freq: 10
  save_freq: 25000                   # 2 checkpoints x ~3.5 GB (5000 wrote 10 of them)
  resume: false
  resume_config_path: null
