# Kit smoke test for the dev container (compose.yaml). Same as vendor/participant/configs/smoke.yaml,
# but reads the kit's mini data from the repo mount and writes under /repo/runs, since the
# container runs as the host user and can't write to the image's /workspace.
#   cd /workspace && ./scripts/run_pipeline.sh /repo/configs/smoke.yaml --smoke

run_name: smoke_libero

vlm:
  protocol: full
  data_path: /repo/vendor/participant/examples/smoke/l1_train_5.jsonl
  eval_data_path: /repo/vendor/participant/examples/smoke/l1_val_2.jsonl
  media_dir: /repo/vendor/participant/examples/smoke

vla:
  suite: libero
  dataset_dir: /repo/vendor/participant/examples/smoke/libero_mini

runtime:
  gpu_indices: [0]
  output_root: /repo/runs
  cache_dir: /repo/runs/cache/core
  lerobot_home: /repo/runs/cache/lerobot
