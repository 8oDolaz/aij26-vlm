# Generator config: seed, dataset quotas, sample mix.

generators:
  phase_qa:
    enabled: true
    # where inside a phase run the question frame is sampled, as fractions of the run length
    frame_range: [0.1, 0.9]
    phase_frame_range:
      contact: [0.1, 0.9]
    seed: 42
    merge_phases: true
    # ask only about these phases; with merge_phases: true only pre_grasp, contact, post_grasp exist
    labeled_phases: [pre_grasp, contact, post_grasp]
    min_phase_seconds: 0.6
    # releasing: the gripper is open and the arm has moved at least this far (meters)
    # from where it let go, so the release is visible on the image
    release_min_distance: 0.04
    blur_max_speed: 0.121 #выше значения - блюр 